<section id="about" class="py-16 px-6 bg-canvas text-slate-100 border-b border-white/[0.06]">
  <div class="max-w-4xl mx-auto space-y-8">
    <div class="text-center">
      <span class="inline-block text-xs font-mono-meta uppercase tracking-[0.14em] text-cinema mb-2">
        Background
      </span>
      <h2 class="page-heading mb-0">{{ aboutContent.heading }}</h2>
    </div>

    <div class="bg-surface border border-white/[0.09] p-6 sm:p-8 rounded-2xl">
      <div class="text-xs font-mono-meta uppercase tracking-widest text-slate-400 mb-3">Executive Summary</div>
      <p class="m-0 text-base sm:text-lg leading-relaxed text-slate-100 font-medium">
        {{ aboutContent.tldr }}
      </p>
    </div>

    <div class="space-y-5 text-left">
      @for (paragraph of aboutContent.paragraphs; track paragraph) {
        <p class="m-0 text-base leading-relaxed text-slate-400">
          {{ paragraph }}
        </p>
      }
    </div>

    <div class="pt-2">
      <button type="button" (click)="openCV()" class="about-cv-btn">
        <i class="fa-regular fa-file-lines text-sm" aria-hidden="true"></i>
        {{ aboutContent.buttonText }}
      </button>
    </div>

    @if (showCVModal()) {
      <app-cv-modal
        [show]="showCVModal()"
        [pdfUrl]="aboutContent.pdfPath"
        [modalTitle]="aboutContent.modalTitle"
        (closeModal)="closeCV()"
      ></app-cv-modal>
    }
  </div>
</section>
