<header class="site-header">
  <nav class="site-nav" aria-label="Primary navigation">
    <!-- Monogram & Name -->
    <a routerLink="/home" class="brand-link" (click)="closeMenu()" aria-label="Raj Pawar Home">
      <span class="brand-mark" aria-hidden="true">
        RP<span class="brand-mark__dot"></span>
      </span>
      <span class="brand-name">Raj Pawar</span>
    </a>

    <!-- Desktop Navigation -->
    <ul class="hidden md:flex items-center gap-1 list-none m-0 p-0">
      @for (item of navItems; track item.route) {
        <li>
          <a
            [routerLink]="item.route"
            routerLinkActive="active-link"
            class="nav-link"
          >
            {{ item.label }}
          </a>
        </li>
      }
    </ul>

    <!-- Desktop Recruiter Quick Actions -->
    <div class="hidden md:flex items-center gap-2.5">
      <a
        href="https://github.com/r-a-j"
        target="_blank"
        rel="noopener noreferrer"
        class="icon-btn"
        aria-label="GitHub profile"
      >
        <i class="fa-brands fa-github" aria-hidden="true"></i>
      </a>
      <a
        href="https://www.linkedin.com/in/rajpawar/"
        target="_blank"
        rel="noopener noreferrer"
        class="icon-btn"
        aria-label="LinkedIn profile"
      >
        <i class="fa-brands fa-linkedin-in" aria-hidden="true"></i>
      </a>
      <button type="button" class="cv-btn" (click)="openCV()">
        <i class="fa-regular fa-file-lines text-xs" aria-hidden="true"></i>
        Resume
      </button>
    </div>

    <!-- Mobile Menu Toggle -->
    <div class="flex md:hidden items-center gap-2">
      <a
        [href]="aboutContent.pdfPath"
        target="_blank"
        rel="noopener noreferrer"
        class="cv-btn"
      >
        Resume
      </a>
      <button
        type="button"
        class="icon-btn"
        (click)="toggleMenu()"
        [attr.aria-expanded]="isMenuOpen()"
        aria-label="Toggle navigation menu"
      >
        <i
          [class]="isMenuOpen() ? 'fa-solid fa-xmark' : 'fa-solid fa-bars'"
          aria-hidden="true"
        ></i>
      </button>
    </div>
  </nav>

  <!-- Mobile Navigation Drawer -->
  @if (isMenuOpen()) {
    <div class="mobile-drawer md:hidden">
      <ul class="flex flex-col gap-1 list-none m-0 p-0">
        @for (item of navItems; track item.route) {
          <li>
            <a
              [routerLink]="item.route"
              routerLinkActive="active-link"
              (click)="closeMenu()"
              class="mobile-link"
            >
              {{ item.label }}
            </a>
          </li>
        }
      </ul>
      <div class="flex items-center gap-3 pt-4 mt-3 border-t border-white/[0.08]">
        <a
          href="https://github.com/r-a-j"
          target="_blank"
          rel="noopener noreferrer"
          class="icon-btn"
          aria-label="GitHub profile"
        >
          <i class="fa-brands fa-github" aria-hidden="true"></i>
        </a>
        <a
          href="https://www.linkedin.com/in/rajpawar/"
          target="_blank"
          rel="noopener noreferrer"
          class="icon-btn"
          aria-label="LinkedIn profile"
        >
          <i class="fa-brands fa-linkedin-in" aria-hidden="true"></i>
        </a>
        <a href="mailto:er.rajpawar@gmail.com" class="text-xs font-mono-meta text-slate-400 hover:text-white ml-auto">
          er.rajpawar&#64;gmail.com
        </a>
      </div>
    </div>
  }
</header>

<app-cv-modal
  [show]="showCVModal()"
  [pdfUrl]="aboutContent.pdfPath"
  [modalTitle]="aboutContent.modalTitle"
  (closeModal)="closeCV()"
></app-cv-modal>
