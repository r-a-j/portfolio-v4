<div class="notification-container" aria-live="polite" aria-atomic="true">
  @for (notification of notificationService.notifications(); track notification) {
    <div class="toast" [class]="'toast toast--' + notification.type" role="status">
      <span class="toast__icon" aria-hidden="true">
        @switch (notification.type) {
          @case ('success') {
            <i class="fa-solid fa-circle-check"></i>
          }
          @case ('message-sent') {
            <i class="fa-solid fa-paper-plane"></i>
          }
          @case ('error') {
            <i class="fa-solid fa-circle-exclamation"></i>
          }
          @case ('warning') {
            <i class="fa-solid fa-triangle-exclamation"></i>
          }
          @default {
            <i class="fa-solid fa-circle-info"></i>
          }
        }
      </span>

      <span class="toast__message">{{ notification.message }}</span>

      <button
        type="button"
        class="toast__close"
        (click)="dismiss(notification)"
        aria-label="Dismiss notification"
      >
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
    </div>
  }
</div>
