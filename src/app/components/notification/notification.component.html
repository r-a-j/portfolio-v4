<div class="notification-container">
  @for (notification of notificationService.notifications(); track notification) {
    <div class="notification"
      [ngClass]="notification.type">
      <div class="icon-container">
        @switch (notification.type) {
          @case ('success') {
            <img src="icons/success.gif" alt="Success Icon" class="icon" />
          }
          @case ('message-sent') {
            <img src="icons/message-sent.gif" alt="Success Icon" class="icon" />
          }
          @case ('error') {
            <img src="icons/error.gif" alt="Error Icon" class="icon" />
          }
          @case ('info') {
            <img src="icons/information.gif" alt="Info Icon" class="icon" />
          }
          @case ('warning') {
            <img src="icons/warning.gif" alt="Warning Icon" class="icon" />
          }
        }
      </div>
      <div class="message-container">
        <span class="message">{{ notification.message }}</span>
      </div>
    </div>
  }
</div>
