<section id="technologies" class="py-16 px-6 bg-canvas text-slate-100 border-t border-white/[0.06]">
  <div class="max-w-5xl mx-auto text-center">
    <span class="inline-block text-xs font-mono-meta uppercase tracking-[0.14em] text-cinema mb-2">
      Technical Stack
    </span>
    <h2 class="page-heading">Skills</h2>

    @for (category of categories; track category.name) {
      <div class="tech-section">
        <h3 class="text-xs font-mono-meta uppercase tracking-[0.12em] text-slate-400 mb-4">{{ category.name }}</h3>
        <div class="tech-grid">
          @for (tech of category.technologies; track tech.name) {
            <div class="tech-card">
              <a [href]="tech.link" target="_blank" rel="noopener noreferrer">
                <img [src]="tech.image" [alt]="tech.name" class="h-12 mx-auto" />
              </a>
              <span class="block mt-2 text-xs font-semibold text-slate-300">{{ tech.name }}</span>
            </div>
          }
        </div>
      </div>
    }
  </div>
</section>
